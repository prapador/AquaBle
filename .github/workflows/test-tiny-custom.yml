name: Test Tiny Custom Curve

on:
  pull_request:
  push:
    branches: [main, feature/tiny-custom-curves]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q custom_components/aquable tests
      - name: Check frontend JavaScript syntax
        run: |
          for script in custom_components/aquable/frontend/*.js; do
            node --check "$script"
          done
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
